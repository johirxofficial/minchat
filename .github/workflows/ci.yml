name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: minchat
          POSTGRES_PASSWORD: minchat
          POSTGRES_DB: minchat_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U minchat -d minchat_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      NODE_ENV: test
      PORT: 5050
      HOST: 127.0.0.1
      APP_ORIGIN: http://localhost:5050
      SESSION_SECRET: ci-session-secret-that-is-definitely-long-enough
      DATABASE_URL: postgres://minchat:minchat@127.0.0.1:5432/minchat_test
      REDIS_URL: redis://127.0.0.1:6379
      STORAGE_DIR: ./storage-test
      ALLOW_DEV_EMAIL: "true"
      SERVE_STATIC: "false"
      LOG_LEVEL: warn
      ADMIN_USERNAME: admin
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: correct horse battery staple

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply migrations
        run: npm run migrate

      - name: Run tests
        run: npm test

      - name: Build client
        run: npm run build

      - name: Check production dependencies for known vulnerabilities
        run: npm audit --omit=dev
